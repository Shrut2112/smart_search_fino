version: '3.8'

services:
  # React Frontend Server
  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:20-alpine AS builder
        WORKDIR /app
        COPY package*.json ./
        RUN npm install
        COPY . .
        RUN npm run build
        
        FROM nginx:alpine
        COPY --from=builder /app/dist /usr/share/nginx/html
        # Nginx config for client-side routing
        RUN echo 'server { listen 80; location / { root /usr/share/nginx/html; index index.html index.htm; try_files $$uri $$uri/ /index.html =404; } }' > /etc/nginx/conf.d/default.conf
        EXPOSE 80
    ports:
      - "5173:80"

  # FastAPI Backend (RAG Core)
  api-backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn api:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  # Streamlit Admin Dashboard
  admin-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run admin_dashboard/Home.py --server.port 8502 --server.address 0.0.0.0
    ports:
      - "8502:8502"
    environment:
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  # Persistent PDF File Watcher
  file-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    command: python watchers/watcher.py
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  # Periodic Firecrawl Web Watcher
  web-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    command: python watchers/web_watcher.py
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
